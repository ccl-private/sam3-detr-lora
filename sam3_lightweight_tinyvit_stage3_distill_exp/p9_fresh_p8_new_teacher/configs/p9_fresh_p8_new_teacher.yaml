experiment: P9-Fresh-TinyViT-Complete-P8-New-Teacher
student_checkpoint: ../../sam3_lightweight_stage3_exp/input/efficientsam3_tinyvit_stage3.pt
teacher_lora: ../../sam3_detr_exp/negative_prompt_ablation/weights/roadline_r8_a16_lr2e4_no_generic_negatives.best.pt
initial_student_lora: null

model:
  detr_lora_rank: 8
  detr_lora_alpha: 16
  image_lora_stages: [1, 2, 3]
  image_lora_rank: 8
  image_lora_alpha: 16
  complete_structure: [P5, P6, P7, P8]

training:
  epochs: 20
  batch_size_per_gpu: 4
  devices: 4
  num_generic_negatives: 0
  lora_lr: 5.0e-5
  image_lora_lr: 1.0e-5
  head_lr: 2.0e-5
  branch_lr: 1.0e-4
  gate_lr: 1.0e-3
  precision: bf16-mixed
  save_every_epoch: true

distillation:
  final_output_kd: true
  image_feature_kd: true
  kd_weight: 1.0
  image_feature_kd_weight: 1.0
  foreground_weight: 4.0
  temperature: 2.0
  quality_threshold: 0.2
